name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    name: Blender 5.3 smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Blender as a Python module
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libgl1 libegl1
          pip install bpy==5.3.0 numpy
      - name: Run every skill script against real Blender
        run: python tests/smoke_test.py
